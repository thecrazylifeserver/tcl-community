name: Discord-Team synchronisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discord-Rollen abrufen
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: "1043265423585575073"
          DISCORD_TEAM_ROLE_ID: "1071470674536845375"
          DISCORD_HELPER_ROLE_ID: "1066893460998717480"
        run: python scripts/update_discord_team.py
      - name: Aktualisierte Teamliste veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team.json
          if ! git diff --cached --quiet; then
            git commit -m "Discord-Team aktualisieren"
            git push
          fi
